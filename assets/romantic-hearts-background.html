<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Romantic Hearts Background</title>
<style>
  :root{
    --black:#0a0412;
    --black-2:#160a24;
    --purple:#9b4de0;
    --purple-deep:#5b1f9e;
    --pink:#ff6fb0;
    --pink-soft:#ffb8dd;
    --white:#fdf6ff;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html,body{
    width:100%; height:100%;
    overflow:hidden;
    background:var(--black);
    font-family: 'Georgia', 'Cormorant Garamond', serif;
  }

  .stage{
    position:relative;
    width:100vw; height:100vh;
    overflow:hidden;
    isolation:isolate;
  }

  /* ---------- animated base gradient ---------- */
  .bg-base{
    position:absolute; inset:-10%;
    background:
      radial-gradient(circle at 20% 30%, var(--purple-deep) 0%, transparent 45%),
      radial-gradient(circle at 80% 70%, var(--pink) 0%, transparent 40%),
      radial-gradient(circle at 50% 100%, var(--purple) 0%, transparent 55%),
      linear-gradient(160deg, var(--black) 0%, var(--black-2) 45%, var(--black) 100%);
    background-size: 180% 180%, 180% 180%, 200% 200%, 100% 100%;
    background-position: 0% 0%, 100% 100%, 50% 100%, 0% 0%;
    animation: drift 26s ease-in-out infinite;
    filter: saturate(1.1);
  }

  @keyframes drift{
    0%   { background-position: 0% 0%, 100% 100%, 50% 100%, 0% 0%; }
    50%  { background-position: 30% 20%, 70% 80%, 60% 80%, 0% 0%; }
    100% { background-position: 0% 0%, 100% 100%, 50% 100%, 0% 0%; }
  }

  /* ---------- soft drifting glow orbs ---------- */
  .orb{
    position:absolute;
    border-radius:50%;
    filter: blur(60px);
    opacity:0.35;
    pointer-events:none;
  }
  .orb-1{ width:38vw; height:38vw; left:-8vw; top:10vh; background:var(--purple); animation: floatOrb 22s ease-in-out infinite; }
  .orb-2{ width:30vw; height:30vw; right:-6vw; top:50vh; background:var(--pink); animation: floatOrb 18s ease-in-out infinite reverse; }
  .orb-3{ width:24vw; height:24vw; left:35vw; bottom:-10vh; background:var(--white); opacity:0.12; animation: floatOrb 30s ease-in-out infinite; }

  @keyframes floatOrb{
    0%,100%{ transform: translate(0,0) scale(1); }
    50%{ transform: translate(4vw,-3vh) scale(1.12); }
  }

  /* ---------- vignette for depth ---------- */
  .vignette{
    position:absolute; inset:0;
    background: radial-gradient(circle at 50% 50%, transparent 40%, rgba(5,2,10,0.75) 100%);
    pointer-events:none;
  }

  /* ---------- sparkles ---------- */
  .sparkle{
    position:absolute;
    width:3px; height:3px;
    background:var(--white);
    border-radius:50%;
    opacity:0;
    animation: twinkle 3.5s ease-in-out infinite;
  }
  @keyframes twinkle{
    0%,100%{ opacity:0; transform:scale(0.6); }
    50%{ opacity:1; transform:scale(1.6); }
  }

  /* ---------- floating hearts ---------- */
  .hearts-layer{
    position:absolute; inset:0;
    pointer-events:none;
  }
  .heart{
    position:absolute;
    bottom:-40px;
    width: var(--s);
    height: var(--s);
    transform: rotate(-45deg) scale(var(--sc));
    opacity:0;
    animation: rise var(--dur) linear forwards;
    animation-delay: var(--del);
  }
  .heart::before,
  .heart::after{
    content:"";
    position:absolute;
    width:var(--s);
    height:var(--s);
    background:var(--c);
    border-radius:50%;
  }
  .heart::before{ top: calc(var(--s) * -0.5); left:0; }
  .heart::after{ left: calc(var(--s) * 0.5); top:0; }
  .heart{ background:var(--c); }
  .heart.glow{ filter: drop-shadow(0 0 10px var(--c)); }

  @keyframes rise{
    0%{
      transform: translate(0,0) rotate(-45deg) scale(var(--sc));
      opacity:0;
    }
    8%{ opacity: var(--op); }
    50%{
      transform: translate(var(--drift), -55vh) rotate(-45deg) scale(var(--sc));
    }
    88%{ opacity: var(--op); }
    100%{
      transform: translate(calc(var(--drift) * -1), -115vh) rotate(-45deg) scale(var(--sc));
      opacity:0;
    }
  }

  /* ---------- center focal heart, one grand orchestrated moment ---------- */
  .focal{
    position:absolute;
    left:50%; top:50%;
    transform: translate(-50%,-50%);
    width:120px; height:120px;
    pointer-events:none;
  }
  .focal .h{
    position:absolute; inset:0;
    transform: rotate(-45deg);
    animation: breathe 5s ease-in-out infinite;
  }
  .focal .h::before, .focal .h::after{
    content:"";
    position:absolute;
    width:120px; height:120px;
    border-radius:50%;
  }
  .focal .h::before{ top:-60px; left:0; }
  .focal .h::after{ left:60px; top:0; }
  .focal .h.pink{ background:var(--pink); filter: blur(2px) drop-shadow(0 0 40px var(--pink)); opacity:0.85; }
  .focal .h.pink::before,.focal .h.pink::after{ background:var(--pink); }
  .focal .h.purple{ background:var(--purple); filter: blur(2px) drop-shadow(0 0 55px var(--purple)); opacity:0.55; transform: rotate(-45deg) scale(1.35); animation-delay: -2.5s; }
  .focal .h.purple::before,.focal .h.purple::after{ background:var(--purple); }

  @keyframes breathe{
    0%,100%{ transform: rotate(-45deg) scale(1); }
    50%{ transform: rotate(-45deg) scale(1.15); }
  }

  @media (prefers-reduced-motion: reduce){
    .bg-base, .orb, .heart, .sparkle, .focal .h{ animation-duration: 0.001s !important; animation-iteration-count: 1 !important; }
  }
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="bg-base"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <div class="focal">
    <div class="h purple"></div>
    <div class="h pink"></div>
  </div>

  <div class="hearts-layer" id="heartsLayer"></div>
  <div id="sparkleLayer"></div>
  <div class="vignette"></div>
</div>

<script>
  const stage = document.getElementById('stage');
  const heartsLayer = document.getElementById('heartsLayer');
  const sparkleLayer = document.getElementById('sparkleLayer');

  const colors = [
    'var(--pink)',
    'var(--pink-soft)',
    'var(--purple)',
    'var(--white)'
  ];

  function spawnHeart(){
    const heart = document.createElement('div');
    heart.className = 'heart' + (Math.random() > 0.55 ? ' glow' : '');

    const size = 10 + Math.random() * 22;          // px
    const left = Math.random() * 100;               // vw
    const duration = 9 + Math.random() * 9;         // s
    const drift = (Math.random() * 14 - 7) + 'vw';
    const scale = (0.7 + Math.random() * 0.8).toFixed(2);
    const opacity = (0.45 + Math.random() * 0.45).toFixed(2);
    const color = colors[Math.floor(Math.random() * colors.length)];

    heart.style.setProperty('--s', size + 'px');
    heart.style.setProperty('--dur', duration + 's');
    heart.style.setProperty('--del', '0s');
    heart.style.setProperty('--drift', drift);
    heart.style.setProperty('--sc', scale);
    heart.style.setProperty('--op', opacity);
    heart.style.setProperty('--c', color);
    heart.style.left = left + 'vw';

    heart.addEventListener('animationend', () => heart.remove());
    heartsLayer.appendChild(heart);
  }

  // continuous stream of hearts, forever
  setInterval(spawnHeart, 550);
  for (let i = 0; i < 8; i++) setTimeout(spawnHeart, i * 300); // seed initial hearts

  // sparkles, scattered once, twinkle forever
  const SPARKLE_COUNT = 45;
  for (let i = 0; i < SPARKLE_COUNT; i++){
    const s = document.createElement('div');
    s.className = 'sparkle';
    s.style.left = Math.random() * 100 + 'vw';
    s.style.top = Math.random() * 100 + 'vh';
    s.style.animationDelay = (Math.random() * 3.5) + 's';
    s.style.animationDuration = (2.5 + Math.random() * 3) + 's';
    sparkleLayer.appendChild(s);
  }
</script>

</body>
</html>
