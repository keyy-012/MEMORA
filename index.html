<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a0412" />
  <meta name="description" content="Memora — Digital gifts made from your memories." />
  <title>Memora</title>

  <style>
    :root{
      --black:#0a0412;
      --black-2:#160a24;
      --purple:#9b4de0;
      --purple-deep:#5b1f9e;
      --pink:#ff6fb0;
      --pink-soft:#ffb8dd;
      --white:#fdf6ff;
      --glass:rgba(10,4,18,.28);
      --line:rgba(255,255,255,.18);
    }

    *{box-sizing:border-box;margin:0;padding:0}
    html,body{width:100%;height:100%;background:var(--black);color:var(--white)}
    body{
      overflow:hidden;
      font-family:Georgia,"Times New Roman",serif;
      -webkit-font-smoothing:antialiased;
    }
    button,a{font:inherit}
    button{color:inherit}

    .stage{
      position:relative;
      width:100vw;
      min-height:100svh;
      overflow:hidden;
      isolation:isolate;
      background:var(--black);
    }

    .bg-base{
      position:absolute; inset:-10%;
      background:
        radial-gradient(circle at 20% 30%, var(--purple-deep) 0%, transparent 45%),
        radial-gradient(circle at 80% 70%, var(--pink) 0%, transparent 40%),
        radial-gradient(circle at 50% 100%, var(--purple) 0%, transparent 55%),
        linear-gradient(160deg, var(--black) 0%, var(--black-2) 45%, var(--black) 100%);
      background-size:180% 180%,180% 180%,200% 200%,100% 100%;
      animation:drift 26s ease-in-out infinite;
      filter:saturate(1.08);
    }

    @keyframes drift{
      0%,100%{background-position:0 0,100% 100%,50% 100%,0 0}
      50%{background-position:30% 20%,70% 80%,60% 80%,0 0}
    }

    .orb{
      position:absolute;
      border-radius:50%;
      filter:blur(70px);
      opacity:.32;
      pointer-events:none;
    }
    .orb-1{width:38vw;height:38vw;left:-8vw;top:10vh;background:var(--purple);animation:floatOrb 22s ease-in-out infinite}
    .orb-2{width:30vw;height:30vw;right:-6vw;top:50vh;background:var(--pink);animation:floatOrb 18s ease-in-out infinite reverse}
    .orb-3{width:24vw;height:24vw;left:35vw;bottom:-10vh;background:var(--white);opacity:.1;animation:floatOrb 30s ease-in-out infinite}
    @keyframes floatOrb{
      0%,100%{transform:translate(0,0) scale(1)}
      50%{transform:translate(4vw,-3vh) scale(1.12)}
    }

    .vignette{
      position:absolute;inset:0;
      background:
        linear-gradient(to bottom,rgba(4,1,8,.32),transparent 30%,transparent 65%,rgba(4,1,8,.38)),
        radial-gradient(circle at 50% 50%,transparent 35%,rgba(5,2,10,.72) 100%);
      pointer-events:none;
      z-index:4;
    }

    .sparkle{
      position:absolute;width:3px;height:3px;background:var(--white);border-radius:50%;
      opacity:0;animation:twinkle 3.5s ease-in-out infinite;z-index:2
    }
    @keyframes twinkle{
      0%,100%{opacity:0;transform:scale(.6)}
      50%{opacity:.95;transform:scale(1.6)}
    }

    .hearts-layer{position:absolute;inset:0;pointer-events:none;z-index:2}
    .heart{
      position:absolute;bottom:-40px;width:var(--s);height:var(--s);
      transform:rotate(-45deg) scale(var(--sc));opacity:0;
      animation:rise var(--dur) linear forwards;
      background:var(--c);
    }
    .heart::before,.heart::after{
      content:"";position:absolute;width:var(--s);height:var(--s);
      background:var(--c);border-radius:50%;
    }
    .heart::before{top:calc(var(--s) * -.5);left:0}
    .heart::after{left:calc(var(--s) * .5);top:0}
    .heart.glow{filter:drop-shadow(0 0 10px var(--c))}
    @keyframes rise{
      0%{transform:translate(0,0) rotate(-45deg) scale(var(--sc));opacity:0}
      8%{opacity:var(--op)}
      50%{transform:translate(var(--drift),-55vh) rotate(-45deg) scale(var(--sc))}
      88%{opacity:var(--op)}
      100%{transform:translate(calc(var(--drift) * -1),-115vh) rotate(-45deg) scale(var(--sc));opacity:0}
    }

    .focal{
      position:absolute;left:50%;top:48%;
      transform:translate(-50%,-50%);
      width:120px;height:120px;pointer-events:none;z-index:3;
    }
    .focal .h{
      position:absolute;inset:0;transform:rotate(-45deg);
      animation:breathe 5s ease-in-out infinite;
    }
    .focal .h::before,.focal .h::after{
      content:"";position:absolute;width:120px;height:120px;border-radius:50%;
    }
    .focal .h::before{top:-60px;left:0}
    .focal .h::after{left:60px;top:0}
    .focal .pink{background:var(--pink);filter:blur(2px) drop-shadow(0 0 46px var(--pink));opacity:.88}
    .focal .pink::before,.focal .pink::after{background:var(--pink)}
    .focal .purple{
      background:var(--purple);filter:blur(2px) drop-shadow(0 0 60px var(--purple));
      opacity:.52;transform:rotate(-45deg) scale(1.35);animation-delay:-2.5s
    }
    .focal .purple::before,.focal .purple::after{background:var(--purple)}
    @keyframes breathe{
      0%,100%{transform:rotate(-45deg) scale(1)}
      50%{transform:rotate(-45deg) scale(1.15)}
    }

    .topbar{
      position:absolute;inset:0 0 auto 0;
      display:flex;justify-content:space-between;align-items:center;
      padding:22px 24px;
      z-index:20;
      pointer-events:none;
    }

    .icon-btn,.language-btn{
      pointer-events:auto;
      border:1px solid var(--line);
      background:var(--glass);
      backdrop-filter:blur(16px);
      -webkit-backdrop-filter:blur(16px);
      box-shadow:0 10px 30px rgba(0,0,0,.18);
      cursor:pointer;
      transition:transform .25s ease,background .25s ease,border-color .25s ease;
    }

    .icon-btn{
      width:48px;height:48px;border-radius:50%;
      display:grid;place-items:center;
    }
    .icon-btn:hover,.language-btn:hover{transform:translateY(-2px);background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.32)}
    .icon-btn:active,.language-btn:active{transform:scale(.94)}

    .hamburger{width:18px;height:12px;display:flex;flex-direction:column;justify-content:space-between}
    .hamburger span{display:block;width:100%;height:1.5px;border-radius:10px;background:#fff;transition:.35s ease}
    .hamburger span:nth-child(2){width:70%}

    .language-wrap{position:relative;pointer-events:auto}
    .language-btn{
      min-width:78px;height:48px;padding:0 14px;border-radius:999px;
      display:flex;align-items:center;justify-content:center;gap:8px;
      font-family:Arial,sans-serif;font-size:12px;letter-spacing:.13em;
    }
    .language-btn .chev{transition:transform .25s ease}
    .language-wrap.open .chev{transform:rotate(180deg)}

    .lang-menu{
      position:absolute;right:0;top:58px;width:150px;padding:8px;
      border:1px solid var(--line);border-radius:18px;
      background:rgba(12,5,22,.78);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
      opacity:0;transform:translateY(-8px) scale(.98);pointer-events:none;
      transition:.25s ease;box-shadow:0 20px 60px rgba(0,0,0,.3)
    }
    .language-wrap.open .lang-menu{opacity:1;transform:none;pointer-events:auto}
    .lang-option{
      width:100%;border:0;background:transparent;color:#fff;text-align:left;
      padding:12px;border-radius:12px;cursor:pointer;font-family:Arial,sans-serif;
      transition:background .2s ease,transform .2s ease
    }
    .lang-option:hover{background:rgba(255,255,255,.08);transform:translateX(2px)}
    .lang-option.active{background:rgba(255,111,176,.14)}

    .hero{
      position:absolute;inset:0;z-index:8;
      display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
      text-align:center;padding:24px 24px clamp(52px,9vh,92px);
      pointer-events:none;
    }

    .brand{
      pointer-events:auto;
      opacity:0;transform:translateY(14px);
      animation:heroIn .9s .35s cubic-bezier(.2,.8,.2,1) forwards;
    }
    .brand-name{
      font-size:clamp(42px,7vw,82px);
      font-weight:400;letter-spacing:.22em;text-indent:.22em;
      text-shadow:0 10px 40px rgba(0,0,0,.42);
    }
    .tagline{
      margin:12px auto 0;max-width:540px;
      font-family:Arial,sans-serif;
      font-size:clamp(13px,1.8vw,17px);font-weight:300;line-height:1.65;
      letter-spacing:.05em;color:rgba(255,255,255,.82)
    }

    .cta{
      margin-top:24px;border:1px solid rgba(255,255,255,.28);
      background:rgba(255,255,255,.08);color:#fff;
      padding:14px 22px;border-radius:999px;
      font-family:Arial,sans-serif;font-size:12px;letter-spacing:.14em;text-transform:uppercase;
      cursor:pointer;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
      transition:transform .25s ease,background .25s ease,box-shadow .25s ease,border-color .25s ease;
      position:relative;overflow:hidden;
    }
    .cta:hover{
      transform:translateY(-2px);
      background:rgba(255,255,255,.14);
      border-color:rgba(255,255,255,.48);
      box-shadow:0 12px 34px rgba(255,111,176,.16);
    }
    .cta:active{transform:scale(.96)}

    @keyframes heroIn{to{opacity:1;transform:none}}

    .menu-overlay{
      position:fixed;inset:0;z-index:50;
      display:grid;grid-template-columns:minmax(260px,420px) 1fr;
      background:rgba(5,2,10,.42);
      backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
      opacity:0;pointer-events:none;transition:opacity .35s ease;
    }
    .menu-overlay.open{opacity:1;pointer-events:auto}
    .menu-panel{
      min-height:100%;padding:28px;
      background:rgba(11,4,19,.88);
      border-right:1px solid rgba(255,255,255,.08);
      transform:translateX(-100%);
      transition:transform .5s cubic-bezier(.16,1,.3,1);
      display:flex;flex-direction:column;
      box-shadow:30px 0 80px rgba(0,0,0,.28)
    }
    .menu-overlay.open .menu-panel{transform:none}
    .menu-head{display:flex;align-items:center;justify-content:space-between}
    .menu-logo{letter-spacing:.25em;font-size:16px}
    .close-btn{border:0;background:transparent;color:#fff;font-size:28px;cursor:pointer;transition:transform .25s ease}
    .close-btn:hover{transform:rotate(8deg) scale(1.08)}
    .menu-nav{margin:auto 0;display:flex;flex-direction:column;gap:8px}
    .menu-link{
      color:#fff;text-decoration:none;font-size:clamp(28px,4vw,50px);
      line-height:1.2;padding:9px 0;opacity:.82;
      transform:translateX(-12px);transition:opacity .25s ease,transform .25s ease;
    }
    .menu-link:hover{opacity:1;transform:translateX(7px)}
    .menu-foot{font-family:Arial,sans-serif;font-size:11px;letter-spacing:.16em;color:rgba(255,255,255,.45)}

    .click-burst{
      position:fixed;width:12px;height:12px;z-index:100;pointer-events:none;
      transform:translate(-50%,-50%) rotate(-45deg);
      background:var(--pink);filter:drop-shadow(0 0 12px var(--pink));
      animation:burst .65s ease-out forwards;
    }
    .click-burst::before,.click-burst::after{
      content:"";position:absolute;width:12px;height:12px;border-radius:50%;background:inherit
    }
    .click-burst::before{top:-6px;left:0}
    .click-burst::after{left:6px;top:0}
    @keyframes burst{
      0%{opacity:0;transform:translate(-50%,-50%) rotate(-45deg) scale(.25)}
      35%{opacity:1}
      100%{opacity:0;transform:translate(-50%,-90px) rotate(-45deg) scale(1.7)}
    }

    .page-flash{
      position:fixed;inset:0;z-index:90;pointer-events:none;
      background:radial-gradient(circle at center,rgba(255,184,221,.14),rgba(10,4,18,.88));
      opacity:0;transition:opacity .28s ease;
    }
    .page-flash.active{opacity:1}

    @media(max-width:700px){
      .topbar{padding:18px}
      .menu-overlay{grid-template-columns:1fr}
      .menu-panel{width:min(86vw,360px)}
      .brand-name{letter-spacing:.16em;text-indent:.16em}
      .tagline{max-width:310px}
      .focal{top:45%;transform:translate(-50%,-50%) scale(.82)}
    }

    @media(prefers-reduced-motion:reduce){
      *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.001ms!important}
    }
  </style>
</head>

<body>
  <main class="stage" id="stage">
    <div class="bg-base"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <div class="focal" aria-hidden="true">
      <div class="h purple"></div>
      <div class="h pink"></div>
    </div>

    <div class="hearts-layer" id="heartsLayer" aria-hidden="true"></div>
    <div id="sparkleLayer" aria-hidden="true"></div>
    <div class="vignette"></div>

    <header class="topbar">
      <button class="icon-btn" id="menuBtn" aria-label="Open menu" aria-expanded="false">
        <span class="hamburger" aria-hidden="true"><span></span><span></span><span></span></span>
      </button>

      <div class="language-wrap" id="languageWrap">
        <button class="language-btn" id="languageBtn" aria-haspopup="true" aria-expanded="false">
          <span id="currentLang">TH</span><span class="chev">⌄</span>
        </button>
        <div class="lang-menu" id="langMenu" role="menu">
          <button class="lang-option active" data-lang="th">ไทย</button>
          <button class="lang-option" data-lang="en">English</button>
        </div>
      </div>
    </header>

    <section class="hero">
      <div class="brand">
        <h1 class="brand-name">MEMORA</h1>
        <p class="tagline" data-i18n="tagline">เปลี่ยนความทรงจำของคุณ ให้กลายเป็นของขวัญที่มีเพียงชิ้นเดียวในโลก</p>
        <button class="cta" id="exploreBtn" data-i18n="explore">สำรวจของขวัญ</button>
      </div>
    </section>
  </main>

  <div class="menu-overlay" id="menuOverlay" aria-hidden="true">
    <aside class="menu-panel" role="dialog" aria-modal="true" aria-label="Main menu">
      <div class="menu-head">
        <div class="menu-logo">MEMORA</div>
        <button class="close-btn" id="closeMenu" aria-label="Close menu">×</button>
      </div>

      <nav class="menu-nav">
        <a class="menu-link" href="#" data-route="home" data-i18n="home">หน้าแรก</a>
        <a class="menu-link" href="#products" data-route="products" data-i18n="products">ของขวัญ</a>
        <a class="menu-link" href="#reviews" data-route="reviews" data-i18n="reviews">รีวิว</a>
        <a class="menu-link" href="#faq" data-route="faq" data-i18n="faq">คำถามที่พบบ่อย</a>
      </nav>

      <div class="menu-foot">DIGITAL GIFTS MADE FROM MEMORIES</div>
    </aside>
  </div>

  <div class="page-flash" id="pageFlash"></div>

  <script>
    "use strict";

    // Scalable language dictionary: add future languages here without rebuilding the UI logic.
    const translations = Object.freeze({
      th: Object.freeze({
        tagline: "เปลี่ยนความทรงจำของคุณ ให้กลายเป็นของขวัญที่มีเพียงชิ้นเดียวในโลก",
        explore: "สำรวจของขวัญ",
        home: "หน้าแรก",
        products: "ของขวัญ",
        reviews: "รีวิว",
        faq: "คำถามที่พบบ่อย"
      }),
      en: Object.freeze({
        tagline: "Turn your memories into a gift that exists nowhere else.",
        explore: "Explore gifts",
        home: "Home",
        products: "Products",
        reviews: "Reviews",
        faq: "FAQ"
      })
    });

    const heartsLayer = document.getElementById("heartsLayer");
    const sparkleLayer = document.getElementById("sparkleLayer");
    const menuOverlay = document.getElementById("menuOverlay");
    const menuBtn = document.getElementById("menuBtn");
    const closeMenu = document.getElementById("closeMenu");
    const languageWrap = document.getElementById("languageWrap");
    const languageBtn = document.getElementById("languageBtn");
    const currentLang = document.getElementById("currentLang");
    const pageFlash = document.getElementById("pageFlash");

    const colors = ["var(--pink)","var(--pink-soft)","var(--purple)","var(--white)"];

    function spawnHeart(){
      if (document.hidden) return;
      const heart = document.createElement("div");
      heart.className = "heart" + (Math.random() > .55 ? " glow" : "");

      const size = 10 + Math.random() * 22;
      heart.style.setProperty("--s", size + "px");
      heart.style.setProperty("--dur", (9 + Math.random() * 9) + "s");
      heart.style.setProperty("--drift", (Math.random() * 14 - 7) + "vw");
      heart.style.setProperty("--sc", (.7 + Math.random() * .8).toFixed(2));
      heart.style.setProperty("--op", (.45 + Math.random() * .45).toFixed(2));
      heart.style.setProperty("--c", colors[Math.floor(Math.random() * colors.length)]);
      heart.style.left = (Math.random() * 100) + "vw";

      heart.addEventListener("animationend", () => heart.remove(), { once:true });
      heartsLayer.appendChild(heart);
    }

    const heartTimer = setInterval(spawnHeart, 620);
    for (let i=0;i<8;i++) setTimeout(spawnHeart, i*260);

    for (let i=0;i<42;i++){
      const s = document.createElement("div");
      s.className = "sparkle";
      s.style.left = Math.random()*100 + "vw";
      s.style.top = Math.random()*100 + "vh";
      s.style.animationDelay = Math.random()*3.5 + "s";
      s.style.animationDuration = 2.5 + Math.random()*3 + "s";
      sparkleLayer.appendChild(s);
    }

    function makeClickBurst(x,y){
      const b = document.createElement("span");
      b.className = "click-burst";
      b.style.left = x + "px";
      b.style.top = y + "px";
      document.body.appendChild(b);
      b.addEventListener("animationend", () => b.remove(), {once:true});
    }

    document.addEventListener("pointerdown", (e) => {
      if (e.pointerType === "mouse" && e.button !== 0) return;
      makeClickBurst(e.clientX, e.clientY);
    }, {passive:true});

    function openMenu(){
      menuOverlay.classList.add("open");
      menuOverlay.setAttribute("aria-hidden","false");
      menuBtn.setAttribute("aria-expanded","true");
    }
    function hideMenu(){
      menuOverlay.classList.remove("open");
      menuOverlay.setAttribute("aria-hidden","true");
      menuBtn.setAttribute("aria-expanded","false");
    }

    menuBtn.addEventListener("click", openMenu);
    closeMenu.addEventListener("click", hideMenu);
    menuOverlay.addEventListener("click", e => {
      if (e.target === menuOverlay) hideMenu();
    });

    languageBtn.addEventListener("click", () => {
      const isOpen = languageWrap.classList.toggle("open");
      languageBtn.setAttribute("aria-expanded", String(isOpen));
    });

    function setLanguage(lang){
      if (!translations[lang]) return;
      document.documentElement.lang = lang;
      currentLang.textContent = lang.toUpperCase();

      document.querySelectorAll("[data-i18n]").forEach(el => {
        const key = el.dataset.i18n;
        if (!translations[lang][key]) return;
        el.animate(
          [{opacity:1,transform:"translateY(0)"},{opacity:0,transform:"translateY(5px)"},{opacity:1,transform:"translateY(0)"}],
          {duration:320,easing:"ease"}
        );
        el.textContent = translations[lang][key];
      });

      document.querySelectorAll(".lang-option").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.lang === lang);
      });

      localStorage.setItem("memora_lang", lang);
      languageWrap.classList.remove("open");
      languageBtn.setAttribute("aria-expanded","false");
    }

    document.querySelectorAll(".lang-option").forEach(btn => {
      btn.addEventListener("click", () => setLanguage(btn.dataset.lang));
    });

    const initialLang = localStorage.getItem("memora_lang") || "th";
    setLanguage(initialLang);

    function transitionThen(callback){
      pageFlash.classList.add("active");
      setTimeout(() => {
        callback();
        setTimeout(() => pageFlash.classList.remove("active"), 120);
      }, 250);
    }

    document.getElementById("exploreBtn").addEventListener("click", () => {
      transitionThen(() => {
        // V1 placeholder — will become Products route/page in the next step.
        history.pushState({}, "", "#products");
      });
    });

    document.querySelectorAll("[data-route]").forEach(link => {
      link.addEventListener("click", e => {
        e.preventDefault();
        const target = link.getAttribute("href");
        hideMenu();
        transitionThen(() => {
          if (target === "#") history.pushState({}, "", location.pathname);
          else history.pushState({}, "", target);
        });
      });
    });

    document.addEventListener("keydown", e => {
      if (e.key === "Escape"){
        hideMenu();
        languageWrap.classList.remove("open");
      }
    });

    document.addEventListener("click", e => {
      if (!languageWrap.contains(e.target)){
        languageWrap.classList.remove("open");
        languageBtn.setAttribute("aria-expanded","false");
      }
    });
  </script>
</body>
</html>
