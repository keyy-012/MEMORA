<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Memora — digital gifts made from memories.">
  <meta name="theme-color" content="#0a0412">
  <title>Memora — Digital Gifts</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@300;400;500&family=Great+Vibes&display=swap');

    :root{
      --bg:#09030f;
      --white:#fff7fc;
      --soft:rgba(255,247,252,.72);
      --line:rgba(255,255,255,.18);
      --glass:rgba(8,3,15,.32);
      --pink:#ff78b7;
      --pink2:#ffb8dc;
    }

    *{box-sizing:border-box}
    html,body{margin:0;width:100%;min-height:100%;background:var(--bg);color:var(--white)}
    body{overflow:hidden;-webkit-font-smoothing:antialiased}
    button,a{font:inherit}

    /* The approved background master lives here and is rendered as a visual layer. */
    .background-master{
      position:fixed;
      inset:0;
      width:100%;
      height:100%;
      border:0;
      z-index:0;
      pointer-events:none;
    }

    .veil{
      position:fixed;
      inset:0;
      z-index:1;
      pointer-events:none;
      background:
        linear-gradient(to bottom,rgba(7,2,12,.16),transparent 32%,transparent 65%,rgba(7,2,12,.34)),
        radial-gradient(circle at 50% 46%,transparent 28%,rgba(5,1,10,.38) 100%);
    }

    .topbar{
      position:fixed;
      top:0;left:0;right:0;
      z-index:20;
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:22px 26px;
    }

    .glass{
      border:1px solid var(--line);
      background:var(--glass);
      backdrop-filter:blur(18px);
      -webkit-backdrop-filter:blur(18px);
      box-shadow:0 14px 50px rgba(0,0,0,.2);
    }

    .menu-button{
      width:52px;height:52px;
      border-radius:50%;
      border:1px solid var(--line);
      background:var(--glass);
      display:grid;place-items:center;
      cursor:pointer;color:#fff;
      transition:transform .3s ease,background .3s ease,border-color .3s ease;
    }
    .menu-button:hover{transform:scale(1.05);background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.34)}
    .menu-lines{width:20px;display:grid;gap:5px}
    .menu-lines span{height:1.5px;background:#fff;border-radius:2px;transition:.35s ease}
    .menu-lines span:nth-child(2){width:70%}

    .lang{
      position:relative;
    }
    .lang-button{
      min-width:82px;height:52px;
      padding:0 17px;
      border-radius:999px;
      color:#fff;
      cursor:pointer;
      display:flex;align-items:center;justify-content:center;gap:9px;
      font-family:"DM Sans",sans-serif;
      font-size:12px;letter-spacing:.16em;
      transition:.3s ease;
    }
    .lang-button:hover{background:rgba(255,255,255,.1)}
    .chevron{transition:transform .3s ease}
    .lang.open .chevron{transform:rotate(180deg)}

    .lang-menu{
      position:absolute;
      right:0;top:61px;
      width:160px;padding:8px;
      border-radius:20px;
      opacity:0;transform:translateY(-10px) scale(.97);
      pointer-events:none;
      transition:.3s cubic-bezier(.2,.8,.2,1);
    }
    .lang.open .lang-menu{opacity:1;transform:none;pointer-events:auto}
    .lang-option{
      width:100%;border:0;background:transparent;color:#fff;
      text-align:left;padding:12px 13px;border-radius:13px;
      cursor:pointer;font-family:"DM Sans",sans-serif;font-size:13px;
      transition:.2s ease;
    }
    .lang-option:hover,.lang-option.active{background:rgba(255,120,183,.13)}

    .hero{
      position:fixed;
      inset:0;
      z-index:10;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      pointer-events:none;
      padding:30px;
    }

    .hero-inner{
      width:min(760px,92vw);
      pointer-events:auto;
      transform:translateY(18px);
      opacity:0;
      animation:heroIn 1.15s cubic-bezier(.16,1,.3,1) .25s forwards;
    }

    .eyebrow{
      font-family:"DM Sans",sans-serif;
      font-size:10px;
      letter-spacing:.38em;
      text-transform:uppercase;
      color:rgba(255,255,255,.64);
      margin-bottom:15px;
    }

    .logo{
      font-family:"Great Vibes",cursive;
      font-size:clamp(68px,12vw,145px);
      font-weight:400;
      line-height:.78;
      letter-spacing:.01em;
      text-shadow:
        0 0 12px rgba(255,120,183,.55),
        0 0 40px rgba(255,120,183,.25),
        0 18px 60px rgba(0,0,0,.45);
    }

    .sub-logo{
      margin-top:19px;
      font-family:"Cormorant Garamond",serif;
      font-size:clamp(13px,1.7vw,18px);
      letter-spacing:.52em;
      text-indent:.52em;
      text-transform:uppercase;
      color:rgba(255,220,239,.9);
    }

    .description{
      max-width:570px;
      margin:27px auto 0;
      font-family:"DM Sans",sans-serif;
      font-weight:300;
      font-size:clamp(13px,1.5vw,16px);
      line-height:1.8;
      color:var(--soft);
    }

    .cta{
      margin-top:30px;
      position:relative;
      border:1px solid rgba(255,190,220,.5);
      color:#fff;
      background:linear-gradient(135deg,rgba(255,120,183,.2),rgba(150,70,220,.14));
      border-radius:999px;
      padding:15px 27px;
      min-width:178px;
      cursor:pointer;
      font-family:"DM Sans",sans-serif;
      font-size:11px;
      letter-spacing:.19em;
      text-transform:uppercase;
      overflow:hidden;
      transition:transform .3s ease,box-shadow .3s ease,background .3s ease;
    }
    .cta::before{
      content:"";
      position:absolute;inset:-2px;
      background:linear-gradient(110deg,transparent 25%,rgba(255,255,255,.4) 50%,transparent 75%);
      transform:translateX(-130%);
      transition:transform .7s ease;
    }
    .cta:hover{transform:translateY(-3px);box-shadow:0 15px 45px rgba(255,100,180,.2)}
    .cta:hover::before{transform:translateX(130%)}
    .cta span{position:relative;z-index:1}

    .menu-overlay{
      position:fixed;inset:0;z-index:50;
      background:rgba(4,1,9,.52);
      backdrop-filter:blur(14px);
      -webkit-backdrop-filter:blur(14px);
      opacity:0;pointer-events:none;
      transition:opacity .45s ease;
    }
    .menu-overlay.open{opacity:1;pointer-events:auto}

    .menu-panel{
      width:min(520px,92vw);
      height:100%;
      padding:30px clamp(26px,5vw,60px);
      background:
        radial-gradient(circle at 20% 25%,rgba(255,100,180,.12),transparent 35%),
        linear-gradient(160deg,rgba(15,4,25,.97),rgba(7,2,13,.94));
      border-right:1px solid rgba(255,255,255,.1);
      transform:translateX(-105%);
      transition:transform .65s cubic-bezier(.16,1,.3,1);
      display:flex;flex-direction:column;
      box-shadow:30px 0 100px rgba(0,0,0,.45);
    }
    .menu-overlay.open .menu-panel{transform:none}

    .menu-head{
      display:flex;align-items:center;justify-content:space-between;
    }
    .menu-brand{
      font-family:"Cormorant Garamond",serif;
      font-size:17px;
      letter-spacing:.34em;
    }
    .close{
      width:46px;height:46px;border-radius:50%;
      border:1px solid var(--line);background:rgba(255,255,255,.04);
      color:#fff;font-size:25px;cursor:pointer;
      transition:.3s ease;
    }
    .close:hover{transform:rotate(90deg);background:rgba(255,255,255,.09)}

    .nav{
      margin:auto 0;
      display:flex;flex-direction:column;
      gap:2px;
    }
    .nav-link{
      position:relative;
      display:flex;align-items:baseline;gap:18px;
      color:#fff;text-decoration:none;
      font-family:"Cormorant Garamond",serif;
      font-size:clamp(38px,6vw,66px);
      line-height:1.15;
      padding:8px 0;
      opacity:.72;
      transform:translateX(-15px);
      transition:.35s ease;
    }
    .nav-link small{
      font-family:"DM Sans",sans-serif;
      font-size:9px;letter-spacing:.22em;
      color:var(--pink2);
      opacity:.8;
    }
    .nav-link:hover{opacity:1;transform:translateX(8px)}
    .nav-link::after{
      content:"";
      position:absolute;left:0;bottom:3px;
      width:0;height:1px;background:var(--pink);
      transition:width .4s ease;
    }
    .nav-link:hover::after{width:72px}

    .menu-footer{
      font-family:"DM Sans",sans-serif;
      font-size:9px;letter-spacing:.2em;
      color:rgba(255,255,255,.4);
    }

    .click-heart{
      position:fixed;
      z-index:100;
      width:10px;height:10px;
      background:var(--pink);
      transform:translate(-50%,-50%) rotate(-45deg);
      pointer-events:none;
      filter:drop-shadow(0 0 10px var(--pink));
      animation:clickHeart .7s ease-out forwards;
    }
    .click-heart:before,.click-heart:after{
      content:"";position:absolute;
      width:10px;height:10px;background:inherit;border-radius:50%;
    }
    .click-heart:before{top:-5px;left:0}
    .click-heart:after{left:5px;top:0}
    @keyframes clickHeart{
      0%{opacity:0;transform:translate(-50%,-50%) rotate(-45deg) scale(.2)}
      25%{opacity:1}
      100%{opacity:0;transform:translate(-50%,-125px) rotate(-45deg) scale(1.7)}
    }

    .flash{
      position:fixed;inset:0;z-index:90;pointer-events:none;
      background:radial-gradient(circle at center,rgba(255,170,215,.14),rgba(7,2,13,.88));
      opacity:0;transition:opacity .35s ease;
    }
    .flash.on{opacity:1}

    @keyframes heroIn{to{opacity:1;transform:none}}

    @media(max-width:700px){
      .topbar{padding:17px}
      .logo{font-size:clamp(65px,20vw,105px)}
      .sub-logo{letter-spacing:.35em;text-indent:.35em}
      .description{max-width:330px}
      .menu-panel{width:88vw}
    }

    @media(prefers-reduced-motion:reduce){
      *,*::before,*::after{
        animation-duration:.001ms!important;
        animation-iteration-count:1!important;
        transition-duration:.001ms!important;
      }
    }
  </style>
</head>

<body>
  <iframe
    class="background-master"
    src="assets/romantic-hearts-background.html"
    title=""
    aria-hidden="true">
  </iframe>

  <div class="veil"></div>

  <header class="topbar">
    <button class="menu-button" id="menuButton" aria-label="Open menu" aria-expanded="false">
      <span class="menu-lines"><span></span><span></span><span></span></span>
    </button>

    <div class="lang" id="lang">
      <button class="lang-button glass" id="langButton" aria-expanded="false">
        <span id="langCurrent">TH</span><span class="chevron">⌄</span>
      </button>
      <div class="lang-menu glass" id="langMenu">
        <button class="lang-option active" data-lang="th">ไทย</button>
        <button class="lang-option" data-lang="en">English</button>
      </div>
    </div>
  </header>

  <main class="hero">
    <section class="hero-inner">
      <div class="eyebrow" data-i18n="eyebrow">DIGITAL GIFTS • MADE WITH LOVE</div>
      <h1 class="logo">Memora</h1>
      <div class="sub-logo">Digital Gifts</div>
      <p class="description" data-i18n="description">
        เปลี่ยนความทรงจำของคุณ ให้กลายเป็นของขวัญดิจิทัลที่มีเพียงชิ้นเดียวในโลก
      </p>
      <button class="cta" id="explore"><span data-i18n="cta">สำรวจของขวัญ</span></button>
    </section>
  </main>

  <div class="menu-overlay" id="menuOverlay" aria-hidden="true">
    <aside class="menu-panel" role="dialog" aria-modal="true" aria-label="Memora menu">
      <div class="menu-head">
        <div class="menu-brand">MEMORA</div>
        <button class="close" id="closeMenu" aria-label="Close menu">×</button>
      </div>

      <nav class="nav">
        <a class="nav-link" href="#" data-route="home"><small>01</small><span data-i18n="home">หน้าแรก</span></a>
        <a class="nav-link" href="#products" data-route="products"><small>02</small><span data-i18n="products">ของขวัญ</span></a>
        <a class="nav-link" href="#reviews" data-route="reviews"><small>03</small><span data-i18n="reviews">รีวิว</span></a>
        <a class="nav-link" href="#faq" data-route="faq"><small>04</small><span data-i18n="faq">คำถามที่พบบ่อย</span></a>
      </nav>

      <div class="menu-footer">EVERY MOMENT, FOREVER MEMORABLE</div>
    </aside>
  </div>

  <div class="flash" id="flash"></div>

  <script>
    "use strict";

    const translations = {
      th:{
        eyebrow:"DIGITAL GIFTS • MADE WITH LOVE",
        description:"เปลี่ยนความทรงจำของคุณ ให้กลายเป็นของขวัญดิจิทัลที่มีเพียงชิ้นเดียวในโลก",
        cta:"สำรวจของขวัญ",home:"หน้าแรก",products:"ของขวัญ",
        reviews:"รีวิว",faq:"คำถามที่พบบ่อย"
      },
      en:{
        eyebrow:"DIGITAL GIFTS • MADE WITH LOVE",
        description:"Turn your memories into a digital gift that exists nowhere else.",
        cta:"Explore gifts",home:"Home",products:"Gifts",
        reviews:"Reviews",faq:"FAQ"
      }
    };

    const $ = s => document.querySelector(s);
    const menuOverlay = $("#menuOverlay");
    const menuButton = $("#menuButton");
    const closeMenu = $("#closeMenu");
    const lang = $("#lang");
    const langButton = $("#langButton");
    const flash = $("#flash");

    function setLanguage(code){
      const t = translations[code] || translations.th;
      document.documentElement.lang = code;
      $("#langCurrent").textContent = code.toUpperCase();

      document.querySelectorAll("[data-i18n]").forEach(el=>{
        const key = el.dataset.i18n;
        if(t[key]) el.textContent = t[key];
      });

      document.querySelectorAll(".lang-option").forEach(b=>{
        b.classList.toggle("active", b.dataset.lang === code);
      });

      localStorage.setItem("memora-language", code);
      lang.classList.remove("open");
      langButton.setAttribute("aria-expanded","false");
    }

    setLanguage(localStorage.getItem("memora-language") || "th");

    langButton.addEventListener("click", e=>{
      e.stopPropagation();
      const open = lang.classList.toggle("open");
      langButton.setAttribute("aria-expanded", String(open));
    });

    document.querySelectorAll(".lang-option").forEach(b=>{
      b.addEventListener("click", ()=>setLanguage(b.dataset.lang));
    });

    function openMenu(){
      menuOverlay.classList.add("open");
      menuOverlay.setAttribute("aria-hidden","false");
      menuButton.setAttribute("aria-expanded","true");
    }

    function hideMenu(){
      menuOverlay.classList.remove("open");
      menuOverlay.setAttribute("aria-hidden","true");
      menuButton.setAttribute("aria-expanded","false");
    }

    menuButton.addEventListener("click", openMenu);
    closeMenu.addEventListener("click", hideMenu);

    menuOverlay.addEventListener("click", e=>{
      if(e.target === menuOverlay) hideMenu();
    });

    document.addEventListener("keydown", e=>{
      if(e.key === "Escape"){
        hideMenu();
        lang.classList.remove("open");
      }
    });

    document.addEventListener("click", e=>{
      if(!lang.contains(e.target)){
        lang.classList.remove("open");
        langButton.setAttribute("aria-expanded","false");
      }
    });

    function transitionTo(hash){
      flash.classList.add("on");
      setTimeout(()=>{
        history.pushState({}, "", hash || location.pathname);
        flash.classList.remove("on");
      },260);
    }

    $("#explore").addEventListener("click", ()=>transitionTo("#products"));

    document.querySelectorAll("[data-route]").forEach(link=>{
      link.addEventListener("click", e=>{
        e.preventDefault();
        hideMenu();
        transitionTo(link.getAttribute("href"));
      });
    });

    // Premium micro-interaction: every primary click creates a tiny floating heart.
    document.addEventListener("pointerdown", e=>{
      if(e.pointerType === "mouse" && e.button !== 0) return;
      const h = document.createElement("span");
      h.className = "click-heart";
      h.style.left = e.clientX + "px";
      h.style.top = e.clientY + "px";
      document.body.appendChild(h);
      h.addEventListener("animationend", ()=>h.remove(), {once:true});
    }, {passive:true});
  </script>
</body>
</html>
